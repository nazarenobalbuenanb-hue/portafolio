<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inscripción a Deportes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>

    <h1 id="title">Formulario de Inscripción a Deportes</h1>
    <p id="description">
      Completa el siguiente formulario para inscribirte en tus actividades deportivas favoritas.
    </p>

    <form id="survey-form" enctype="multipart/form-data">
      
      <label id="name-label" for="name">Nombre completo:</label>
      <input type="text" id="name" name="nombre" placeholder="Ej: Sofía Ramírez" required />

      <label id="email-label" for="email">Correo electrónico:</label>
      <input type="email" id="email" name="correo" placeholder="Ej: sofia@gmail.com" required />

      <label for="dni">DNI:</label>
      <input type="text" id="dni" name="dni" placeholder="Ej: 12345678" required />

      <label for="fecha">Fecha de nacimiento:</label>
      <input type="date" id="fecha" name="fecha_nacimiento" required />

      <label id="number-label" for="number">Número de contacto:</label>
      <input type="number" id="number" name="numero" min="1000000" max="9999999999" placeholder="Ej: 123456789" />

      <label for="dropdown">Tipo de membresía:</label>
      <select id="dropdown" name="membresia" required>
        <option value="" disabled selected>Selecciona una opción</option>
        <option value="mensual">Mensual</option>
        <option value="anual">Anual</option>
        <option value="personalizada">Personalizada</option>
      </select>

      <fieldset>
        <legend>Género:</legend>
        <label><input type="radio" name="genero" value="masculino" />Masculino</label>
        <label><input type="radio" name="genero" value="femenino" />Femenino</label>
        <label><input type="radio" name="genero" value="otro" />Otro</label>
      </fieldset>

      <fieldset>
        <legend>¿A qué actividades te gustaría inscribirte?</legend>
        <label><input type="checkbox" name="actividades" value="musculacion" />Musculación</label>
        <label><input type="checkbox" name="actividades" value="natacion" />Natación</label>
        <label><input type="checkbox" name="actividades" value="futbol" />Fútbol</label>
        <label><input type="checkbox" name="actividades" value="basquet" />Básquet</label>
        <label><input type="checkbox" name="actividades" value="voley" />Vóley</label>
        <label><input type="checkbox" name="actividades" value="boxeo" />Boxeo</label>
      </fieldset>

      <label for="aptitud">Sube tu certificado de aptitud física:</label>
      <input
        type="file"
        id="aptitud"
        name="certificado_aptitud"
        accept=".pdf, .jpg, .jpeg, .png"
        required
      />
      <small>(Formatos permitidos: PDF, JPG, PNG. Máx. 5MB)</small>

      <label for="comentarios">Comentarios adicionales:</label>
      <textarea id="comentarios" name="comentarios" placeholder="Escribe aquí tus observaciones o preferencias..."></textarea>

      <button id="submit" type="submit">Enviar inscripción</button>
    </form>
  </main>
</body>
</html>
